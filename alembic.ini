# Alembic configuration for Intentest.
#
# The database URL is NOT hard-coded here: `backend/alembic/env.py` reads it from
# the application settings (pydantic-settings), i.e. from DATABASE_URL in the
# environment / .env file. The `sqlalchemy.url` key below is intentionally left
# blank so that a stray `alembic upgrade head` never silently targets a
# different database than the application.
#
# Usage (from the `intentest/` repository root):
#   alembic upgrade head
#   alembic downgrade base
#   alembic revision --autogenerate -m "message"
#   alembic current
#   alembic history --verbose
#
# The migration scripts live under backend/alembic/versions and the initial
# revision (0001_initial) creates the full schema described in ARCHITECTURE.md
# §3 (Fact–Intent DAG), including the pgvector extension, the six core tables
# (project, scope, fact, intent, intent_source, plus support tables), the
# immutability triggers (fact_immutable, intent_source_write_once), the
# event-table NOTIFY trigger on channel `intentest_events`, and the partial
# indexes used by the scheduler tick.

[alembic]
script_location = backend/alembic
prepend_sys_path = backend
version_path_separator = os
sqlalchemy.url =

# Timestamp format used in new revision filenames: YYYYMMDD_HHMM
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d-%%(rev)s_%%(slug)s

# Truncate the slug portion of the filename when a message is very long.
truncate_slug_length = 40

# Use a two-digit (or longer) revision number prefix.
recursive_version_locations = false
sourceless = false

# Do not run ruff/black automatically; formatting is handled by the project.
revision_environment = false
timezone = UTC

# ---------------------------------------------------------------------------
# Logging configuration used when alembic runs standalone
# ---------------------------------------------------------------------------
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
